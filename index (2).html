<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWA Token - 実世界資産投資プラットフォーム</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        .animate-slideIn {
            animation: slideIn 0.5s ease-out;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glow-effect {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.2);
        }
        
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // アイコンコンポーネント
        function Icon({ name, className = "w-6 h-6" }) {
            const icons = {
                building: (<svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>),
                wallet: (<svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>),
                chart: (<svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>),
                trending: (<svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>),
                logout: (<svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>),
                check: (<svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>),
                x: (<svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>),
                home: (<svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>),
                briefcase: (<svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>),
                menu: (<svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>),
            };
            return icons[name] || null;
        }

        // メインアプリケーション
        function RWATokenApp() {
            const [walletAddress, setWalletAddress] = useState('');
            const [currentPage, setCurrentPage] = useState('home');
            const [portfolio, setPortfolio] = useState([]);
            const [totalInvested, setTotalInvested] = useState(0);
            const [selectedAsset, setSelectedAsset] = useState(null);
            const [investAmount, setInvestAmount] = useState('');
            const [showNotification, setShowNotification] = useState(false);
            const [notificationMessage, setNotificationMessage] = useState('');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            // 資産データ
            const assets = [
                {
                    id: 1,
                    name: '東京オフィスビル',
                    type: 'real-estate',
                    typeName: '不動産',
                    location: '東京都港区',
                    image: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=400&q=80',
                    price: 10000,
                    minInvestment: 10000,
                    apy: 6.5,
                    totalValue: 50000000,
                    investors: 234,
                    progress: 68,
                    description: '港区の一等地に位置する最新オフィスビル。安定した賃貸収入が見込めます。'
                },
                {
                    id: 2,
                    name: '大阪商業施設',
                    type: 'real-estate',
                    typeName: '不動産',
                    location: '大阪府大阪市',
                    image: 'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=400&q=80',
                    price: 5000,
                    minInvestment: 5000,
                    apy: 7.2,
                    totalValue: 30000000,
                    investors: 189,
                    progress: 45,
                    description: '大阪の主要商業エリアの商業施設。高い稼働率を維持しています。'
                },
                {
                    id: 3,
                    name: 'ゴールド現物',
                    type: 'commodity',
                    typeName: 'コモディティ',
                    location: 'スイス保管',
                    image: 'https://images.unsplash.com/photo-1610375461246-83df859d849d?w=400&q=80',
                    price: 5000,
                    minInvestment: 5000,
                    apy: 4.8,
                    totalValue: 20000000,
                    investors: 456,
                    progress: 82,
                    description: 'スイスの安全な金庫に保管された実物ゴールド。インフレヘッジに最適。'
                },
                {
                    id: 4,
                    name: '米国社債ファンド',
                    type: 'bond',
                    typeName: '債券',
                    location: '米国',
                    image: 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=400&q=80',
                    price: 50000,
                    minInvestment: 50000,
                    apy: 5.5,
                    totalValue: 100000000,
                    investors: 567,
                    progress: 91,
                    description: '格付けAA以上の米国優良企業の社債ポートフォリオ。'
                },
                {
                    id: 5,
                    name: '銀座高級マンション',
                    type: 'real-estate',
                    typeName: '不動産',
                    location: '東京都中央区',
                    image: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=400&q=80',
                    price: 20000,
                    minInvestment: 20000,
                    apy: 5.8,
                    totalValue: 80000000,
                    investors: 312,
                    progress: 73,
                    description: '銀座の高級レジデンス。富裕層向けの賃貸需要が安定。'
                },
                {
                    id: 6,
                    name: 'プラチナ現物',
                    type: 'commodity',
                    typeName: 'コモディティ',
                    location: 'ロンドン保管',
                    image: 'https://images.unsplash.com/photo-1611652022419-a9419f74343a?w=400&q=80',
                    price: 10000,
                    minInvestment: 10000,
                    apy: 4.2,
                    totalValue: 15000000,
                    investors: 198,
                    progress: 56,
                    description: '工業用・投資用として需要の高いプラチナの現物資産。'
                }
            ];

            // ローカルストレージからデータ読み込み
            useEffect(() => {
                const savedWallet = localStorage.getItem('rwa_wallet');
                const savedPortfolio = localStorage.getItem('rwa_portfolio');
                
                if (savedWallet) {
                    setWalletAddress(savedWallet);
                }
                
                if (savedPortfolio) {
                    const parsedPortfolio = JSON.parse(savedPortfolio);
                    setPortfolio(parsedPortfolio);
                    
                    const total = parsedPortfolio.reduce((sum, item) => sum + item.amount, 0);
                    setTotalInvested(total);
                }
            }, []);

            // ウォレット接続
            const connectWallet = async () => {
                if (typeof window.ethereum !== 'undefined') {
                    try {
                        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                        const address = accounts[0];
                        setWalletAddress(address);
                        localStorage.setItem('rwa_wallet', address);
                        showNotificationMessage('✅ ウォレットが接続されました！');
                    } catch (error) {
                        showNotificationMessage('❌ ウォレット接続に失敗しました');
                    }
                } else {
                    // MetaMaskがない場合はデモモードで接続
                    const demoAddress = '0x' + Math.random().toString(16).substr(2, 40);
                    setWalletAddress(demoAddress);
                    localStorage.setItem('rwa_wallet', demoAddress);
                    showNotificationMessage('✅ デモウォレットで接続しました');
                }
            };

            // ウォレット切断
            const disconnectWallet = () => {
                setWalletAddress('');
                localStorage.removeItem('rwa_wallet');
                setCurrentPage('home');
                showNotificationMessage('ウォレットを切断しました');
            };

            // 通知表示
            const showNotificationMessage = (message) => {
                setNotificationMessage(message);
                setShowNotification(true);
                setTimeout(() => setShowNotification(false), 3000);
            };

            // 投資処理
            const handleInvest = () => {
                if (!selectedAsset || !investAmount || investAmount < selectedAsset.minInvestment) {
                    showNotificationMessage('⚠️ 投資金額を確認してください');
                    return;
                }

                const amount = parseFloat(investAmount);
                const newInvestment = {
                    id: Date.now(),
                    assetId: selectedAsset.id,
                    assetName: selectedAsset.name,
                    assetType: selectedAsset.typeName,
                    amount: amount,
                    apy: selectedAsset.apy,
                    date: new Date().toISOString(),
                    shares: amount / selectedAsset.price
                };

                const newPortfolio = [...portfolio, newInvestment];
                setPortfolio(newPortfolio);
                setTotalInvested(totalInvested + amount);
                
                localStorage.setItem('rwa_portfolio', JSON.stringify(newPortfolio));
                
                showNotificationMessage(`🎉 ${selectedAsset.name}に¥${amount.toLocaleString()}投資しました！`);
                setSelectedAsset(null);
                setInvestAmount('');
                setCurrentPage('portfolio');
            };

            // 総資産額計算
            const calculateTotalValue = () => {
                return portfolio.reduce((sum, item) => {
                    const monthsPassed = Math.floor((new Date() - new Date(item.date)) / (1000 * 60 * 60 * 24 * 30));
                    const returns = (item.amount * item.apy / 100 / 12) * monthsPassed;
                    return sum + item.amount + returns;
                }, 0);
            };

            // ページコンテンツ
            const renderPage = () => {
                if (!walletAddress) {
                    return <WelcomePage onConnect={connectWallet} />;
                }

                switch (currentPage) {
                    case 'home':
                        return <HomePage assets={assets} onSelectAsset={(asset) => { setSelectedAsset(asset); setCurrentPage('invest'); }} />;
                    case 'portfolio':
                        return <PortfolioPage portfolio={portfolio} totalInvested={totalInvested} totalValue={calculateTotalValue()} />;
                    case 'invest':
                        return <InvestPage asset={selectedAsset} amount={investAmount} setAmount={setInvestAmount} onInvest={handleInvest} onCancel={() => { setSelectedAsset(null); setCurrentPage('home'); }} />;
                    default:
                        return <HomePage assets={assets} onSelectAsset={(asset) => { setSelectedAsset(asset); setCurrentPage('invest'); }} />;
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-950 via-blue-950 to-slate-950 text-white">
                    {/* Background Effects */}
                    <div className="fixed inset-0 overflow-hidden pointer-events-none">
                        <div className="absolute top-0 -left-4 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-float"></div>
                        <div className="absolute top-0 -right-4 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-float" style={{ animationDelay: '2s' }}></div>
                    </div>

                    {/* Header */}
                    {walletAddress && (
                        <header className="relative z-50 glass-effect border-b border-slate-800">
                            <div className="container mx-auto px-6 py-4">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                                            <Icon name="building" className="w-6 h-6" />
                                        </div>
                                        <span className="text-xl font-bold">RWA Token</span>
                                    </div>

                                    <nav className="hidden md:flex items-center space-x-6">
                                        <button onClick={() => setCurrentPage('home')} className={`flex items-center space-x-2 ${currentPage === 'home' ? 'text-blue-400' : 'text-slate-400 hover:text-white'} transition`}>
                                            <Icon name="home" className="w-5 h-5" />
                                            <span>ホーム</span>
                                        </button>
                                        <button onClick={() => setCurrentPage('portfolio')} className={`flex items-center space-x-2 ${currentPage === 'portfolio' ? 'text-blue-400' : 'text-slate-400 hover:text-white'} transition`}>
                                            <Icon name="briefcase" className="w-5 h-5" />
                                            <span>ポートフォリオ</span>
                                        </button>
                                    </nav>

                                    <div className="flex items-center space-x-4">
                                        <div className="hidden md:flex glass-effect px-4 py-2 rounded-lg items-center space-x-2">
                                            <Icon name="wallet" className="w-5 h-5 text-green-400" />
                                            <span className="text-sm font-mono">
                                                {walletAddress.substring(0, 6)}...{walletAddress.substring(walletAddress.length - 4)}
                                            </span>
                                        </div>
                                        <button onClick={disconnectWallet} className="p-2 hover:bg-red-500/20 rounded-lg transition">
                                            <Icon name="logout" className="w-5 h-5 text-red-400" />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </header>
                    )}

                    {/* Main Content */}
                    <main className="relative z-10">
                        {renderPage()}
                    </main>

                    {/* Notification */}
                    {showNotification && (
                        <div className="fixed bottom-6 right-6 z-50 animate-slideIn">
                            <div className="glass-effect border border-blue-500/50 rounded-xl px-6 py-4 max-w-sm">
                                <p className="text-white">{notificationMessage}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ウェルカムページ
        function WelcomePage({ onConnect }) {
            return (
                <div className="container mx-auto px-6 py-20">
                    <div className="max-w-2xl mx-auto text-center">
                        <div className="w-24 h-24 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center mx-auto mb-8 glow-effect">
                            <Icon name="building" className="w-12 h-12" />
                        </div>
                        
                        <h1 className="text-5xl md:text-6xl font-black mb-6">
                            <span className="bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                                RWA Token
                            </span>
                        </h1>
                        
                        <p className="text-xl md:text-2xl text-slate-300 mb-12">
                            実世界の資産をブロックチェーン上でトークン化。
                            <br />
                            小口から始められる、新しい投資体験。
                        </p>

                        <button 
                            onClick={onConnect}
                            className="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 px-10 py-5 rounded-xl text-lg font-bold transition glow-effect flex items-center space-x-3 mx-auto"
                        >
                            <Icon name="wallet" className="w-6 h-6" />
                            <span>ウォレットを接続</span>
                        </button>

                        <p className="text-sm text-slate-500 mt-6">
                            MetaMaskまたはデモモードで接続できます
                        </p>
                    </div>
                </div>
            );
        }

        // ホームページ
        function HomePage({ assets, onSelectAsset }) {
            const [filter, setFilter] = useState('all');

            const filteredAssets = filter === 'all' 
                ? assets 
                : assets.filter(asset => asset.type === filter);

            return (
                <div className="container mx-auto px-6 py-8">
                    <div className="mb-8">
                        <h1 className="text-3xl md:text-4xl font-black mb-4">投資可能な資産</h1>
                        <p className="text-slate-400">実世界の資産をトークン化した投資商品を探す</p>
                    </div>

                    {/* フィルター */}
                    <div className="flex flex-wrap gap-3 mb-8">
                        <button 
                            onClick={() => setFilter('all')}
                            className={`px-6 py-2 rounded-lg font-semibold transition ${filter === 'all' ? 'bg-blue-500' : 'glass-effect hover:bg-white/10'}`}
                        >
                            すべて
                        </button>
                        <button 
                            onClick={() => setFilter('real-estate')}
                            className={`px-6 py-2 rounded-lg font-semibold transition ${filter === 'real-estate' ? 'bg-blue-500' : 'glass-effect hover:bg-white/10'}`}
                        >
                            不動産
                        </button>
                        <button 
                            onClick={() => setFilter('commodity')}
                            className={`px-6 py-2 rounded-lg font-semibold transition ${filter === 'commodity' ? 'bg-blue-500' : 'glass-effect hover:bg-white/10'}`}
                        >
                            コモディティ
                        </button>
                        <button 
                            onClick={() => setFilter('bond')}
                            className={`px-6 py-2 rounded-lg font-semibold transition ${filter === 'bond' ? 'bg-blue-500' : 'glass-effect hover:bg-white/10'}`}
                        >
                            債券
                        </button>
                    </div>

                    {/* 資産グリッド */}
                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredAssets.map(asset => (
                            <div key={asset.id} className="glass-effect rounded-2xl overflow-hidden card-hover cursor-pointer" onClick={() => onSelectAsset(asset)}>
                                <div className="relative h-48 overflow-hidden">
                                    <img src={asset.image} alt={asset.name} className="w-full h-full object-cover" />
                                    <div className="absolute top-4 right-4 bg-blue-500 px-3 py-1 rounded-full text-sm font-semibold">
                                        {asset.typeName}
                                    </div>
                                </div>
                                
                                <div className="p-6">
                                    <h3 className="text-xl font-bold mb-2">{asset.name}</h3>
                                    <p className="text-slate-400 text-sm mb-4">{asset.location}</p>

                                    <div className="mb-4">
                                        <div className="flex justify-between text-sm mb-2">
                                            <span className="text-slate-400">資金調達進捗</span>
                                            <span className="text-blue-400 font-semibold">{asset.progress}%</span>
                                        </div>
                                        <div className="w-full bg-slate-800 rounded-full h-2">
                                            <div className="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full transition-all" style={{ width: `${asset.progress}%` }}></div>
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-end">
                                        <div>
                                            <div className="text-slate-500 text-xs mb-1">最小投資額</div>
                                            <div className="text-lg font-bold text-blue-400">¥{asset.minInvestment.toLocaleString()}</div>
                                        </div>
                                        <div>
                                            <div className="text-slate-500 text-xs mb-1">想定利回り</div>
                                            <div className="text-lg font-bold text-green-400">{asset.apy}%</div>
                                        </div>
                                    </div>

                                    <div className="mt-4 pt-4 border-t border-slate-700/50 flex items-center justify-between text-sm">
                                        <span className="text-slate-400">{asset.investors}人が投資中</span>
                                        <span className="text-blue-400 font-semibold">詳細 →</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // 投資ページ
        function InvestPage({ asset, amount, setAmount, onInvest, onCancel }) {
            if (!asset) return null;

            const calculateReturns = (years) => {
                const investAmount = parseFloat(amount) || 0;
                return investAmount * Math.pow(1 + asset.apy / 100, years);
            };

            return (
                <div className="container mx-auto px-6 py-8">
                    <button onClick={onCancel} className="text-slate-400 hover:text-white mb-6 flex items-center space-x-2">
                        <span>← 戻る</span>
                    </button>

                    <div className="max-w-5xl mx-auto">
                        <div className="grid md:grid-cols-2 gap-8">
                            {/* 資産詳細 */}
                            <div className="space-y-6">
                                <div className="glass-effect rounded-2xl overflow-hidden">
                                    <img src={asset.image} alt={asset.name} className="w-full h-64 object-cover" />
                                    
                                    <div className="p-6">
                                        <div className="inline-block bg-blue-500 px-3 py-1 rounded-full text-sm font-semibold mb-4">
                                            {asset.typeName}
                                        </div>
                                        
                                        <h1 className="text-3xl font-black mb-4">{asset.name}</h1>
                                        
                                        <p className="text-slate-400 mb-6">{asset.description}</p>

                                        <div className="space-y-3">
                                            <div className="flex justify-between py-2 border-b border-slate-800">
                                                <span className="text-slate-400">所在地</span>
                                                <span className="font-semibold">{asset.location}</span>
                                            </div>
                                            <div className="flex justify-between py-2 border-b border-slate-800">
                                                <span className="text-slate-400">想定利回り</span>
                                                <span className="font-semibold text-green-400">{asset.apy}% / 年</span>
                                            </div>
                                            <div className="flex justify-between py-2 border-b border-slate-800">
                                                <span className="text-slate-400">最小投資額</span>
                                                <span className="font-semibold">¥{asset.minInvestment.toLocaleString()}</span>
                                            </div>
                                            <div className="flex justify-between py-2 border-b border-slate-800">
                                                <span className="text-slate-400">総評価額</span>
                                                <span className="font-semibold">¥{asset.totalValue.toLocaleString()}</span>
                                            </div>
                                            <div className="flex justify-between py-2">
                                                <span className="text-slate-400">投資家数</span>
                                                <span className="font-semibold">{asset.investors}人</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* 投資フォーム */}
                            <div className="space-y-6">
                                <div className="glass-effect rounded-2xl p-6">
                                    <h2 className="text-2xl font-bold mb-6">投資金額を入力</h2>
                                    
                                    <div className="mb-6">
                                        <label className="block text-slate-400 mb-2">投資金額（円）</label>
                                        <input 
                                            type="number"
                                            value={amount}
                                            onChange={(e) => setAmount(e.target.value)}
                                            min={asset.minInvestment}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-2xl font-bold focus:border-blue-500 focus:outline-none"
                                            placeholder={asset.minInvestment.toLocaleString()}
                                        />
                                        {amount && amount < asset.minInvestment && (
                                            <p className="text-red-400 text-sm mt-2">最小投資額は¥{asset.minInvestment.toLocaleString()}です</p>
                                        )}
                                    </div>

                                    {/* クイック選択 */}
                                    <div className="grid grid-cols-3 gap-3 mb-6">
                                        {[asset.minInvestment, asset.minInvestment * 5, asset.minInvestment * 10].map(val => (
                                            <button 
                                                key={val}
                                                onClick={() => setAmount(val.toString())}
                                                className="glass-effect hover:bg-white/10 py-2 rounded-lg text-sm font-semibold transition"
                                            >
                                                ¥{val >= 1000 ? (val / 1000) + 'k' : val}
                                            </button>
                                        ))}
                                    </div>

                                    {/* 予想リターン */}
                                    {amount && amount >= asset.minInvestment && (
                                        <div className="bg-gradient-to-r from-blue-500/20 to-purple-500/20 rounded-xl p-4 mb-6">
                                            <h3 className="text-sm text-slate-400 mb-3">予想リターン</h3>
                                            <div className="space-y-2">
                                                <div className="flex justify-between">
                                                    <span className="text-sm">1年後</span>
                                                    <span className="font-bold text-green-400">¥{calculateReturns(1).toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-sm">3年後</span>
                                                    <span className="font-bold text-green-400">¥{calculateReturns(3).toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-sm">5年後</span>
                                                    <span className="font-bold text-green-400">¥{calculateReturns(5).toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <button 
                                        onClick={onInvest}
                                        disabled={!amount || amount < asset.minInvestment}
                                        className="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 disabled:from-slate-700 disabled:to-slate-700 disabled:cursor-not-allowed px-6 py-4 rounded-xl font-bold text-lg transition glow-effect"
                                    >
                                        投資を実行
                                    </button>

                                    <p className="text-xs text-slate-500 mt-4 text-center">
                                        ※ 投資はシミュレーションです。実際の取引は行われません。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ポートフォリオページ
        function PortfolioPage({ portfolio, totalInvested, totalValue }) {
            const totalReturns = totalValue - totalInvested;
            const returnRate = totalInvested > 0 ? ((totalReturns / totalInvested) * 100) : 0;

            return (
                <div className="container mx-auto px-6 py-8">
                    <h1 className="text-3xl md:text-4xl font-black mb-8">マイポートフォリオ</h1>

                    {portfolio.length === 0 ? (
                        <div className="glass-effect rounded-2xl p-12 text-center">
                            <Icon name="briefcase" className="w-16 h-16 mx-auto mb-4 text-slate-600" />
                            <h2 className="text-2xl font-bold mb-2">まだ投資がありません</h2>
                            <p className="text-slate-400 mb-6">資産を選んで投資を始めましょう</p>
                        </div>
                    ) : (
                        <>
                            {/* サマリーカード */}
                            <div className="grid md:grid-cols-3 gap-6 mb-8">
                                <div className="glass-effect rounded-2xl p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-slate-400">総投資額</span>
                                        <Icon name="wallet" className="w-5 h-5 text-blue-400" />
                                    </div>
                                    <div className="text-3xl font-black">¥{totalInvested.toLocaleString()}</div>
                                </div>

                                <div className="glass-effect rounded-2xl p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-slate-400">現在の評価額</span>
                                        <Icon name="trending" className="w-5 h-5 text-green-400" />
                                    </div>
                                    <div className="text-3xl font-black text-green-400">¥{totalValue.toLocaleString(undefined, {maximumFractionDigits: 0})}</div>
                                </div>

                                <div className="glass-effect rounded-2xl p-6">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-slate-400">総リターン</span>
                                        <Icon name="chart" className="w-5 h-5 text-purple-400" />
                                    </div>
                                    <div className="text-3xl font-black text-purple-400">
                                        {returnRate >= 0 ? '+' : ''}{returnRate.toFixed(2)}%
                                    </div>
                                    <div className="text-sm text-slate-400 mt-1">
                                        ¥{totalReturns.toLocaleString(undefined, {maximumFractionDigits: 0})}
                                    </div>
                                </div>
                            </div>

                            {/* 投資リスト */}
                            <div className="glass-effect rounded-2xl p-6">
                                <h2 className="text-2xl font-bold mb-6">投資一覧</h2>
                                <div className="space-y-4">
                                    {portfolio.map(investment => {
                                        const monthsPassed = Math.floor((new Date() - new Date(investment.date)) / (1000 * 60 * 60 * 24 * 30));
                                        const currentReturns = (investment.amount * investment.apy / 100 / 12) * monthsPassed;
                                        const currentValue = investment.amount + currentReturns;
                                        
                                        return (
                                            <div key={investment.id} className="bg-slate-900/50 rounded-xl p-4 hover:bg-slate-900/70 transition">
                                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                                    <div className="flex-1">
                                                        <h3 className="font-bold text-lg mb-1">{investment.assetName}</h3>
                                                        <div className="flex flex-wrap items-center gap-2 text-sm text-slate-400">
                                                            <span>{investment.assetType}</span>
                                                            <span>•</span>
                                                            <span>利回り {investment.apy}%</span>
                                                            <span>•</span>
                                                            <span>{new Date(investment.date).toLocaleDateString('ja-JP')}</span>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-2xl font-bold">¥{currentValue.toLocaleString(undefined, {maximumFractionDigits: 0})}</div>
                                                        <div className="text-sm text-green-400">+¥{currentReturns.toLocaleString(undefined, {maximumFractionDigits: 0})}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        // レンダリング
        ReactDOM.render(<RWATokenApp />, document.getElementById('root'));
    </script>
</body>
</html>
